name: STOXRA worker checks
on:
  pull_request:
    paths: ['automation/**', '.github/workflows/stoxra-*.yml']
  push:
    paths: ['automation/**', '.github/workflows/stoxra-*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r automation/requirements.txt
      - run: PYTHONPATH=automation python -m pytest automation/tests -q
      - run: PYTHONPATH=automation python -m stoxra --example automation/examples/post.json --date 2026-01-03
