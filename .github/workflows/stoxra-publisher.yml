name: STOXRA Instagram publisher
on:
  schedule:
    - cron: '30 4 * * *' # 10:00 Asia/Kolkata; Actions scheduling is best-effort.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Dry-run, prepare, or publish an already approved post'
        type: choice
        options: [dry-run, prepare, publish, auto]
        default: dry-run
      post_date:
        description: 'Optional YYYY-MM-DD (IST); use original date to resume'
        type: string
permissions:
  contents: read
concurrency:
  group: stoxra-instagram-publisher
  cancel-in-progress: false
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Configure required reviewers for this environment if desired.
    environment: stoxra-publishing
    env:
      PYTHONPATH: automation
      REQUESTED_MODE: ${{ inputs.mode }}
      POST_DATE: ${{ inputs.post_date }}
      ENABLE_LIVE: ${{ vars.STOXRA_ENABLE_LIVE || 'false' }}
      REQUIRE_APPROVAL: ${{ vars.STOXRA_REQUIRE_APPROVAL || 'true' }}
      EDITORIAL_BASELINE_APPROVED: ${{ vars.STOXRA_EDITORIAL_BASELINE_APPROVED || 'false' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      PUBLISH_SUPABASE_URL: ${{ secrets.PUBLISH_SUPABASE_URL }}
      PUBLISH_SUPABASE_KEY: ${{ secrets.PUBLISH_SUPABASE_KEY }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_TOKEN_EXPIRES_AT: ${{ secrets.INSTAGRAM_TOKEN_EXPIRES_AT }}
      META_API_VERSION: ${{ vars.META_API_VERSION }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r automation/requirements.txt
      - run: python -m pytest automation/tests -q
      - name: Run guarded pipeline
        shell: bash
        run: |
          set -euo pipefail
          mode="${REQUESTED_MODE:-auto}"
          if [ "$ENABLE_LIVE" != true ]; then
            if [ "$mode" != auto ] && [ "$mode" != dry-run ]; then
              echo 'Live mode is disabled'; exit 1
            fi
            mode=dry-run
          fi
          args=(--mode "$mode")
          if [ "$mode" = dry-run ]; then
            args+=(--example automation/examples/post.json --date 2026-01-03)
          elif [ -n "$POST_DATE" ]; then
            args+=(--date "$POST_DATE")
          fi
          python -m stoxra "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stoxra-review-${{ github.run_id }}
          path: automation/output/
          retention-days: 30
          if-no-files-found: ignore
  alert:
    needs: worker
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create failure alert
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title 'STOXRA publishing run failed: operator review required' --body "Review workflow: $RUN_URL. Inspect durable state before retrying. A publishing state may require manual Meta reconciliation."
